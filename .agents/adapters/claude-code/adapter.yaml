runtime: claude-code
version: 1
output_format: SKILL.md
install_path: ~/.claude/skills/{pack}/{skill}/

transforms:
  frontmatter:
    - copy: [id, name, version, description, tags]
    - rename:
        from: tools
        to: allowed-tools

  body:
    - copy: true

  filename:
    - template: "SKILL.md"

  defaults:
    allowed-tools:
      - Read
      - Glob
      - Grep
      - Edit
      - Write
      - Bash
      - Task
